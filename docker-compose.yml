services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: minimdm
      POSTGRES_USER: minimdm
      POSTGRES_PASSWORD: minimdm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_DB: minimdm
      POSTGRES_USER: minimdm
      POSTGRES_PASSWORD: minimdm
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-change-in-production

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://minimdm:minimdm@db:5432/minimdm?sslmode=disable

volumes:
  postgres_data:
